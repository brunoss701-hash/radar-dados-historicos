name: Atualizar dados do Radar

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "collector.py"

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar dados
        run: python collector.py

      - name: Salvar novos dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

          git add data/latest.json data/summary.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao."
          else
            git commit -m "Atualiza dados do radar"
            git push
          fi
