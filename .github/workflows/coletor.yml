name: Atualizar dados do Radar

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "collector.py"
      - ".github/workflows/coletor.yml"

  schedule:
    # Coleta horária normal.
    - cron: "17 * * * *"
    # Coletas extras ~10 min antes do radar das 7h, 8h, 12h e 18h (America/Bahia = UTC-3).
    - cron: "50 9,10,14,20 * * *"

concurrency:
  group: radar-dados-historicos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar dados
        run: python collector.py

      - name: Salvar novos dados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

          git add data/radar.json data/latest.json data/summary.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao."
          else
            git commit -m "Atualiza dados do radar"
            git pull --rebase origin main
            git push
          fi
